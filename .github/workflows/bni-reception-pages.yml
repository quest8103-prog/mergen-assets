name: Deploy BNI Reception SOP to Pages

on:
  push:
    branches: ["main"]
    paths:
      - "bni-reception/**"
      - ".github/workflows/bni-reception-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "bni-reception-pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./bni-reception

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
